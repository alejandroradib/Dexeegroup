name: CI

on:
  pull_request:
  push:
    branches: [claude/dexeegroup-app-development-arhark]

# Read-only token for every job (audit I21); no job writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      EMAIL_FROM: Dexee <no-reply@dexeegroup.com>
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      # Actions are pinned to commit SHAs (audit I21); the comment records the tag they resolve.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # env.ts requires a random cron secret of 32+ characters. It is generated per run so no
      # secret-shaped literal lives in the repository.
      - run: echo "CRON_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run db:verify
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Scans the commits of the pull request (or the push) for secrets.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
